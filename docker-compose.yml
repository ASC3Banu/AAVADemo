version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistics-api
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URI=mongodb://mongodb:27017
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    networks:
      - logistics-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  mongodb:
    image: mongo:7
    container_name: logistics-mongodb
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb-data:/data/db
    networks:
      - logistics-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: logistics-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - logistics-network
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  mongodb-data:
  redis-data:

networks:
  logistics-network:
    driver: bridge